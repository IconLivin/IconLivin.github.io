<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Центральная комиссия по предвыборным гаданиям</title>
<meta name="description" content="Сатирическая слот-машина к выборам в Кнессет 27 октября 2026. Пять в ряд — и машина объявляет, за кого ты проголосуешь.">
<meta name="color-scheme" content="light">
<meta property="og:title" content="Твой голос — ?">
<meta property="og:description" content="Слот-машина предвыборных гаданий. Крути, пока пять лиц не сойдутся в линию.">
<meta property="og:type" content="website">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231b1a17'/%3E%3Crect x='7' y='11' width='18' height='12' rx='2' fill='none' stroke='%23b08a3e' stroke-width='2'/%3E%3Cpath d='M7 12l9 6 9-6' fill='none' stroke='%23b08a3e' stroke-width='2'/%3E%3C/svg%3E">
</head>
<body>

<div class="sheet">

  <header class="masthead">
    <div class="crest" aria-hidden="true">
      <span class="crest-inner">ג</span>
    </div>
    <div class="titles">
      <p class="eyebrow" id="eyebrow"><span class="eyebrow-he">משרד הפנאי הממלכתי · </span>Отдел предвыборных гаданий</p>
      <h1 id="bodyName">Центральная комиссия по предвыборным гаданиям</h1>
      <p class="subtitle" id="subtitle">Официальный бланк · 27.10.2026</p>
    </div>
    <nav class="langs" id="langs" aria-label="Язык">
      <button type="button" data-lang="ru">RU</button>
      <button type="button" data-lang="he">עב</button>
      <button type="button" data-lang="en">EN</button>
    </nav>
  </header>

  <p class="status" id="status" role="status">…</p>

  <main>
    <section class="machine" aria-label="Слот-машина">
      <div class="machine-frame">
        <div class="window-wrap">
          <div class="window" id="window"></div>
          <svg class="payline" id="payline" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
        </div>
        <div class="machine-foot">
          <svg class="paylines" viewBox="0 0 130 70" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-width=".9" stroke-linecap="round" stroke-linejoin="round" opacity=".6">
              <path d="M15 15H115"></path>
              <path d="M15 35H115"></path>
              <path d="M15 55H115"></path>
              <path d="M15 15L40 35L65 55L90 35L115 15"></path>
              <path d="M15 55L40 35L65 15L90 35L115 55"></path>
            </g>
            <g fill="currentColor">
              <circle cx="15" cy="15" r="1.9"></circle><circle cx="40" cy="15" r="1.9"></circle><circle cx="65" cy="15" r="1.9"></circle><circle cx="90" cy="15" r="1.9"></circle><circle cx="115" cy="15" r="1.9"></circle>
              <circle cx="15" cy="35" r="1.9"></circle><circle cx="40" cy="35" r="1.9"></circle><circle cx="65" cy="35" r="1.9"></circle><circle cx="90" cy="35" r="1.9"></circle><circle cx="115" cy="35" r="1.9"></circle>
              <circle cx="15" cy="55" r="1.9"></circle><circle cx="40" cy="55" r="1.9"></circle><circle cx="65" cy="55" r="1.9"></circle><circle cx="90" cy="55" r="1.9"></circle><circle cx="115" cy="55" r="1.9"></circle>
            </g>
          </svg>
          <p class="paylines-note" id="linesNote">5 линий: три горизонтали и две диагонали</p>
        </div>
      </div>

      <div class="controls">
        <button class="spin" id="spin" type="button">
          <span id="spinLabel">Крутить</span>
        </button>
        <div class="meta">
          <span id="spins">Прокрутов: 0</span>
          <span class="dot" aria-hidden="true">·</span>
          <span id="seed" class="seed"></span>
        </div>
        <div class="toggles">
          <button type="button" id="turbo" class="chip" aria-pressed="false">Турбо</button>
          <button type="button" id="sound" class="chip" aria-pressed="false">Звук</button>
        </div>
      </div>
    </section>

    <section class="slip" id="slip" hidden aria-live="polite">
      <p class="slip-label" id="slipLabel">Твой голос</p>
      <div class="slip-body">
        <div class="slip-photo" id="slipPhoto"></div>
        <div class="slip-text">
          <p class="slip-party" id="slipParty"></p>
          <p class="slip-leader" id="slipLeader"></p>
          <p class="slip-reason" id="slipReason"></p>
        </div>
      </div>
      <p class="slip-meta"><span id="slipDetermined"></span> <span id="slipLines" class="slip-lines" hidden></span></p>
      <div class="slip-actions">
        <button type="button" class="btn primary" id="share">Поделиться</button>
        <button type="button" class="btn" id="download">Скачать карточку</button>
        <button type="button" class="btn ghost" id="again">Ещё раз</button>
      </div>
    </section>

    <details class="legend" id="legend">
      <summary id="legendTitle">Кто это</summary>
      <ul id="legendList"></ul>
      <p class="legend-note" id="jokerNote"></p>
    </details>
  </main>

  <footer class="colophon">
    <p id="footerText">Сатира.</p>
    <p class="credits"><a href="CREDITS.md" id="creditsLink">Авторы фото</a></p>
  </footer>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">Прежде чем крутить</h2>
    <p id="modalP"></p>
    <p id="modalPhotos"></p>
    <button type="button" class="btn primary" id="modalOk">Понятно, крутим</button>
  </div>
</div>

<canvas id="card" width="1080" height="1350" hidden></canvas>

<script src="data/parties.js"></script>
<script src="js/engine.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
